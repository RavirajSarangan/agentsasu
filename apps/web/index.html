amil with big text, reminds them to take their medicine, texts you if a dose is missed, calls family by voice and sends an alert if they say “udhavi” (help)."}}, {"@type": "Question", "name": "Which Macs?", "acceptedAnswer": {"@type": "Answer", "text": "Apple Silicon Macs with macOS 13 Ventura or newer."}}, {"@type": "Question", "name": "macOS says Sasu “can't be opened”?", "acceptedAnswer": {"@type": "Answer", "text": "Sasu isn't notarized by Apple yet. Open System Settings → Privacy & Security, scroll down and click “Open Anyway” next to Sasu. You only need to do this once."}}]}</script>
