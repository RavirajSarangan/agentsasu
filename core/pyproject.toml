[project]
name = "sasu-core"
version = "0.4.1"
description = "SASU agent core: voice, brain and tools (Tauri sidecar)"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "cryptography>=43",
  "httpx>=0.27",
  "numpy>=2",
  "sounddevice>=0.5",
  "sherpa-onnx>=1.13",
  "sherpa-onnx-core>=1.13",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.7", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# The formatter owns line width; long AppleScript strings stay readable on one line.
ignore = ["E501"]

[tool.mypy]
strict = true
packages = ["sasu_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sasu_core"]

[[tool.mypy.overrides]]
module = ["sherpa_onnx", "sherpa_onnx.*", "sounddevice"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Talks to the untyped native voice libraries.
module = ["sasu_core.voice.pipeline"]
disallow_untyped_calls = false
